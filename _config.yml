# Configuration du site KHN
title: Dojo Digital by KHN équipements
description: "Équipements et vêtements sportifs personnalisés pour clubs, équipes et sportifs."
url: "https://dojodigital.social" # Domaine personnalisé
baseurl: "" # Vide car le site est à la racine du domaine
author: Dojo Digital by KHN équipements

# Build settings
markdown: kramdown
highlighter: rouge

# Permaliens propres
permalink: /:categories/:year/:month/:day/:title/

# Collections et defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclusions
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

# Plugins compatibles GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Réseaux sociaux (placeholders)
social:
  tiktok: "https://tiktok.com/@dojodigital"
  instagram: "https://instagram.com/dojodigital"
  twitter: "https://x.com/dojodigital"

# Navigation principale
navigation:
  - title: Accueil
    url: /
  - title: Produits
    url: /#produits
  - title: Personnalisation
    url: /#personnalisation
  - title: À propos
    url: /a-propos/
  - title: Contact
    url: /contact/
  - title: Demander un devis
    url: /#devis

# Catégories avec descriptions
categories_info:
  judo:
    name: "Judo"
    description: "Équipements et tenues personnalisés pour les clubs de judo."
    color: "#2563eb"
  mma:
    name: "MMA"
    description: "Tenues techniques et équipements pour les sports de combat."
    color: "#dc2626"
  jujitsu:
    name: "Jujitsu / BJJ"
    description: "Kimonos, rashguards et accessoires pour le Jiu-jitsu brésilien."
    color: "#7c3aed"
  lutte:
    name: "Lutte"
    description: "Équipement robuste et personnalisable pour la lutte et le grappling."
    color: "#059669"
