{% assign share_url = page.url | absolute_url | url_encode %}
{% assign share_title = page.title | url_encode %}

<div class="share-buttons">
  <span class="share-label">Partager :</span>
  
  <!-- Partage X (Twitter) -->
  <a href="https://twitter.com/intent/tweet?url={{ share_url }}&text={{ share_title }}" 
     target="_blank" 
     rel="noopener noreferrer" 
     class="share-btn share-twitter"
     aria-label="Partager sur X">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </svg>
    <span>X</span>
  </a>
  
  <!-- Partage Facebook -->
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}" 
     target="_blank" 
     rel="noopener noreferrer" 
     class="share-btn share-facebook"
     aria-label="Partager sur Facebook">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
    </svg>
    <span>Facebook</span>
  </a>
  
  <!-- Copier le lien -->
  <button onclick="copyLink('{{ page.url | absolute_url }}')" 
          class="share-btn share-copy"
          aria-label="Copier le lien">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
    <span>Copier</span>
  </button>
</div>
